<!DOCTYPE html>
<!-- Verb Master: Level UP 2BAC verb memorisation platform. 182 verbs (108 irregular + 74 regular) in 10 units, 6 activities per unit.
     Static HTML/CSS/JS for GitHub Pages; embeddable in LearnWorlds. Files: index.html (layout + styles), verbs-data.js (data), app.js (logic), assets/.
     Progress is kept in this browser only (localStorage). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verb Master | Level UP 2BAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#123d70;--navy2:#0b2a52;--blue:#2563eb;--teal:#0f8b8d;--teal2:#e0f4f4;--gold:#d4a017;--gold2:#fdf3d7;--ink:#1e3a5f;--muted:#64748b;--ok:#15803d;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--line:#d8e5f4;--bg:#f4f7fb;--sel:#d9f0f0}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Poppins,Arial,sans-serif;line-height:1.5}
.quiz-container{width:100%;max-width:100%;min-height:100vh}
.quiz-card{width:100%;max-width:1100px;margin:0 auto;background:#fff;min-height:100vh}
/* frozen header + info bar (teacher's template) */
.quiz-header{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#eaf4ff;padding:10px 14px}
.header-teacher-img,.header-logo-img{height:64px;width:auto;max-width:none;object-fit:contain;flex:none}
@media (min-width:600px){.header-teacher-img,.header-logo-img{height:80px}}
@media (min-width:1024px){.header-teacher-img,.header-logo-img{height:96px}}
@media (max-width:640px){.header-teacher-img,.header-logo-img{height:45px}.quiz-header{padding:8px 12px}}
img[data-broken]{display:none}
.header-title{flex:1;min-width:0;text-align:center;line-height:1.2}
.title-line1{font-family:'Poppins',sans-serif;font-size:26px;font-weight:800;color:#1e3a5f}
.title-line2{font-family:'Poppins',sans-serif;font-size:18px;font-weight:400;color:#2563eb}
.title-line3{font-family:'Poppins',sans-serif;font-size:14px;font-weight:400;color:#64748b}
@media (max-width:640px){.title-line1{font-size:16px}.title-line2{font-size:12px}.title-line3{font-size:10px}}
.info-bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:8px 14px}
/* general */
.main{padding:14px}
.instruction{background:var(--navy);color:#fff;font-weight:700;border-radius:10px;padding:12px 14px;text-transform:uppercase;margin:0 0 12px}
.task{font-weight:700;text-align:center;margin:12px 0}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1b1b1b}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tile:focus-visible,.unit:focus-visible,.act:focus-visible,.ftile:focus-visible,.slot3:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ar{font-family:'Noto Naskh Arabic','Segoe UI',Tahoma,Arial,sans-serif;direction:rtl;unicode-bidi:isolate;line-height:1.8}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.fatal{margin:20px;padding:16px;background:var(--badbg);border-radius:10px;white-space:pre-wrap}
.warn{font-size:13px;background:var(--gold2);color:#7a5a00;border-radius:10px;padding:8px 10px;margin:0 0 12px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.nav-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
/* dashboard */
.hero{text-align:center;background:linear-gradient(135deg,var(--navy2),var(--navy) 55%,var(--teal));color:#fff;border-radius:14px;padding:18px 14px;margin:0 0 14px;border-bottom:4px solid var(--gold)}
.hero h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.5px}
.hero h1 span{color:var(--gold)}
.hero p{margin:4px 0 0;opacity:.92}
@media (max-width:640px){.hero{padding:12px 10px}.hero h1{font-size:20px}.hero p{font-size:13px}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 14px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:#fff}
.stat b{display:block;font-size:22px;color:var(--navy)}
.stat small{color:var(--muted);font-size:12px}
.lvlbar{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:6px}.lvlbar span{display:block;height:100%;background:var(--gold)}
.section-title{font-size:17px;font-weight:800;margin:16px 0 8px;color:var(--navy)}
.units{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:900px){.units{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.units{grid-template-columns:repeat(2,minmax(0,1fr))}}
.unit{font:inherit;text-align:left;border:2px solid var(--line);border-radius:14px;background:#fff;padding:12px;cursor:pointer;color:var(--ink);min-height:44px;position:relative}
.unit:hover{border-color:var(--teal);background:#f7fcfc}
.unit b{display:block;font-size:17px;color:var(--navy)}
.unit small{display:block;color:var(--muted);font-size:12px}
.unit .acts{font-size:13px;font-weight:700;color:var(--teal);margin-top:4px}
.unit.complete{border-color:var(--gold);background:var(--gold2)}
.unit .crown{position:absolute;top:8px;right:10px;font-size:18px}
.bar{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden;display:flex;margin-top:6px}
.bar span{display:block;height:100%}
.st-new{background:#cbd5e1}.st-learning{background:#f59e0b}.st-practising{background:#0ea5a7}.st-mastered{background:#16a34a}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.panel{border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px;background:#fff}
.revrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.revrow select{font:inherit;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;color:var(--ink)}
.badges{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:700px){.badges{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bdg{border:1px dashed var(--line);border-radius:12px;padding:8px;text-align:center;font-size:12px;color:var(--muted)}
.bdg .ic{font-size:24px;display:block;filter:grayscale(1);opacity:.4}
.bdg.on{border:2px solid var(--gold);background:var(--gold2);color:var(--ink)}
.bdg.on .ic{filter:none;opacity:1}
.bdg b{display:block;font-size:13px}
/* unit page */
.acts-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.acts-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.acts-grid{grid-template-columns:1fr}}
.act{font:inherit;text-align:left;border:2px solid var(--line);border-radius:14px;background:#fff;padding:14px;cursor:pointer;color:var(--ink);min-height:44px}
.act:hover{border-color:var(--teal);background:#f7fcfc}
.act .num{display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;text-align:center;font-weight:700;line-height:26px;margin-right:6px;font-size:13px}
.act b{font-size:16px}
.act small{display:block;color:var(--muted);margin-top:4px}
.act .meta{display:block;font-size:12px;color:var(--navy);margin-top:6px;font-weight:600}
.act.done{border-color:var(--ok)}
.act.done .num{background:var(--ok)}
.vt{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.vt th,.vt td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.vt th{color:var(--muted);font-size:12px;font-weight:600}
.vt td.ar{text-align:right}
.tablewrap{overflow-x:auto}
/* rounds */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px;font-weight:600;font-size:14px;flex-wrap:wrap}
.pill{display:inline-block;background:var(--gold2);color:#7a5a00;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700}
.progress{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:0 0 12px}.progress span{display:block;height:100%;background:var(--teal)}
.big-verb{font-size:30px;font-weight:800;text-align:center;margin:8px 0 6px;color:var(--navy)}
.clue{font-size:19px;text-align:center;margin:8px 0 14px;font-weight:600}
.clue.ar{font-size:26px}
.sub-ar{text-align:center;font-size:20px;margin:0 0 6px}
.gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--teal);margin:0 3px}
.fill{color:var(--ok);font-weight:800;border-bottom:3px solid var(--ok)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tiles.long{grid-template-columns:1fr}
.tile{font:inherit;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px;min-height:44px;cursor:pointer;color:var(--ink);overflow-wrap:anywhere}
.tile.correct{border-color:var(--ok);background:var(--okbg)}
.tile.wrong{border-color:var(--bad);background:var(--badbg)}
.tile:disabled{cursor:default;color:var(--ink)}
.tile .ar,.tile.ar{text-align:right;font-size:18px}
.feedback{margin-top:12px;padding:10px 12px;border-radius:10px}
.feedback.good{background:var(--okbg)}.feedback.badf{background:var(--badbg)}.feedback.retry{background:var(--gold2)}
.forms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.forms div{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.forms small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}
.forms b{font-size:17px;overflow-wrap:anywhere}
/* flashcards */
.flash{border:2px solid var(--line);border-radius:16px;padding:18px 14px;text-align:center;background:linear-gradient(180deg,#fff,#f6fbfb);min-height:220px}
.flash .front-hint{color:var(--muted);font-size:14px}
.flash .ex{margin-top:10px;font-style:italic}
.flash .exar{margin-top:2px;font-size:17px}
.flash .mean{font-weight:600;margin-top:6px}
.typetag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px;background:var(--teal2);color:var(--teal);margin-bottom:6px}
.speak{font:inherit;border:1px solid var(--line);background:#fff;border-radius:999px;min-height:44px;min-width:44px;cursor:pointer;font-size:18px}
/* match */
.match{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:10px}
@media (max-width:640px){.match{grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:8px}.match .tile{padding:10px 8px;font-size:14px}}
.match .col{display:flex;flex-direction:column;gap:8px}
.match .tile.active{border-color:var(--teal);background:var(--sel)}
.match .tile.done{border-color:var(--ok);background:var(--okbg);opacity:.75}
.match .tile.flash{border-color:var(--bad);background:var(--badbg)}
.match .verbcol .tile{font-weight:700;text-align:center}
.match .tile.ar{font-size:19px;line-height:1.5}
/* build */
.slots3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.slot3{font:inherit;border:2px dashed var(--teal);border-radius:10px;min-height:64px;background:#fff;cursor:pointer;padding:6px;color:var(--ink);overflow-wrap:anywhere}
.slot3 small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase}
.slot3 b{font-size:16px}
.slot3.filled{border-style:solid;background:var(--teal2)}
.slot3.ok{border-color:var(--ok);background:var(--okbg)}.slot3.no{border-color:var(--bad);background:var(--badbg)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
.ftile{font:inherit;font-weight:700;border:2px solid var(--navy);border-radius:10px;background:#fff;color:var(--navy);min-height:44px;padding:8px 12px;cursor:pointer}
.ftile:disabled{opacity:.25;cursor:default}
/* typing */
.typed{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.typed label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;text-align:center}
.typed .given{border:1px solid var(--line);border-radius:10px;min-height:48px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;overflow-wrap:anywhere;padding:4px}
.typed input,.ctxin{font:inherit;font-size:17px;width:100%;min-height:48px;border:2px solid var(--teal);border-radius:10px;padding:6px 8px;text-align:center;color:var(--ink)}
.typed input.ok,.ctxin.ok{border-color:var(--ok);background:var(--okbg)}.typed input.no,.ctxin.no{border-color:var(--bad);background:var(--badbg)}
.ctxin{max-width:320px;display:block;margin:0 auto}
@media (max-width:420px){.typed,.forms,.slots3{gap:5px}.typed .given,.forms b,.slot3 b{font-size:14px}.typed input{font-size:16px;padding:4px}}
/* results */
.result{text-align:center}
.badge{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:150px;height:150px;border-radius:50%;background:var(--navy);color:#fff;font-size:30px;font-weight:800;margin:12px;border:5px solid var(--gold)}
.badge small{font-size:14px;font-weight:600}
.remark{font-size:22px;font-weight:800;min-height:34px}
.gain{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.review-item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;text-align:left}
.newbadge{display:inline-block;background:var(--gold2);border:2px solid var(--gold);border-radius:12px;padding:6px 12px;margin:4px;font-weight:700}
.confirm{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--badbg);border-radius:10px;padding:8px}
</style>
</head>
<body>
<div class="quiz-container"><div class="quiz-card">
  <header class="quiz-header">
    <img class="header-teacher-img" id="teacherImg" src="assets/teacher.png" alt="Teacher Soufiane">
    <div class="header-title"><div class="title-line1">English2BAC Quizzes</div><div class="title-line2">Learn • Practice • Succeed</div><div class="title-line3">with Teacher.Soufiane</div></div>
    <img class="header-logo-img" id="logoImg" src="assets/logo.png" alt="Level-UP 2BAC">
  </header>
  <div class="info-bar"><span id="infoL">UNITS: 1–10</span><span id="infoC">IRREGULAR &amp; REGULAR VERBS</span><span id="infoR">VERB-MASTER</span></div>
  <div class="main"><div id="app"><p>Loading…</p></div><div id="liveMsg" class="sr-only" role="status" aria-live="polite"></div></div>
</div></div>
<script>
/* hide a brand image that cannot load instead of showing a broken icon */
['teacherImg', 'logoImg'].forEach(function (id) { var im = document.getElementById(id); im.onerror = function () { im.setAttribute('data-broken', ''); }; if (im.complete && !im.naturalWidth) im.setAttribute('data-broken', ''); });
</script>
<script src="verbs-data.js"></script>
<script src="app.js"></script>
<script>
/* if a script file could not load, say so instead of leaving "Loading…" */
window.addEventListener('load', function () { if (!window.__vpReady) { var a = document.getElementById('app'); if (a && !a.querySelector('.fatal')) a.innerHTML = '<div class="fatal" role="alert">This activity could not start: a file did not load. Please reload the page.</div>'; } });
</script>
<noscript><p class="fatal">This activity needs JavaScript.</p></noscript>
</body>
</html>
